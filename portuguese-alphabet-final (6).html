<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Practice</title>

<style>
body { 
    font-family: Arial; 
    background:#f5f7fa; 
    margin:0; 
}

header {
    background:#2a6df4;
    color:white;
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

nav {
    display:flex;
    justify-content:center;
    gap:10px;
    background:#2a6df4;
    padding-bottom:10px;
}

nav button {
    background:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition: 0.3s;
}

nav button:hover {
    background:#e0e0e0;
}

.container { 
    max-width:900px; 
    margin:auto; 
    padding:20px; 
}

.card {
    background:white;
    padding:20px;
    margin:20px 0;
    border-radius:12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h2 {
    margin-top:0;
    color:#2a6df4;
}

button.main {
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#2a6df4;
    color:white;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
    transition: 0.3s;
}

button.main:hover {
    background:#1e52c4;
}

.option {
    background:#eee;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    cursor:pointer;
    transition: 0.3s;
    border: 2px solid transparent;
}

.option:hover {
    background:#ddd;
}

.option.done {
    cursor:not-allowed;
}

.correct { 
    background:#b6f5c2;
    border-color:#4caf50;
}

.wrong { 
    background:#f5b6b6;
    border-color:#f44336;
}

input {
    padding:10px;
    width:100%;
    margin-top:10px;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

input:focus {
    outline:none;
    border-color:#2a6df4;
}

.result {
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    min-height:25px;
}

.stats {
    background:#f0f0f0;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

.alphabet-buttons {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.alphabet-buttons button {
    flex:1;
    min-width:50px;
}

.loading {
    display:inline-block;
    width:12px;
    height:12px;
    border:2px solid #f3f3f3;
    border-top:2px solid #2a6df4;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-left:5px;
}

@keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
}
</style>
</head>

<body>

<header id="title">葡萄牙语练习</header>

<nav>
<button onclick="setLang('zh')">🇨🇳 中文</button>
<button onclick="setLang('en')">🇺🇸 English</button>
</nav>

<div class="container">

<!-- ALFABETO -->
<div class="card">
<h2 id="alphabetTitle">🔤 字母练习</h2>
<p id="alphabetText">点击并跟读：</p>
<div id="alphabet" class="alphabet-buttons"></div>
</div>

<!-- JOGO -->
<div class="card">
<h2 id="gameTitle">🎮 字母测试</h2>
<p id="gameText">听声音并选择正确的字母：</p>
<button class="main" onclick="playAlphabet()">🔊 <span id="playBtnText">播放</span></button>
<div id="alphabetGame"></div>
<p id="alphabetResult" class="result"></p>
</div>

<!-- ESCUTA -->
<div class="card">
<h2 id="listenTitle">👂 听力练习</h2>
<p id="listenInstructions">选择你听到的单词：</p>

<p><strong id="word1">casa</strong></p>
<button class="main" onclick="speak('casa')">🔊</button>
<div class="option" onclick="check(this,true)">casa</div>
<div class="option" onclick="check(this,false)">cosa</div>

<hr>

<p><strong id="word2">mesa</strong></p>
<button class="main" onclick="speak('mesa')">🔊</button>
<div class="option" onclick="check(this,true)">mesa</div>
<div class="option" onclick="check(this,false)">misa</div>

<hr>

<p><strong id="word3">bolo</strong></p>
<button class="main" onclick="speak('bolo')">🔊</button>
<div class="option" onclick="check(this,true)">bolo</div>
<div class="option" onclick="check(this,false)">balo</div>

</div>

<!-- R vs L -->
<div class="card">
<h2 id="rlTitle">🔊 R 和 L 区别</h2>
<p id="rlInstructions">区分 R 和 L 的声音：</p>

<p><strong id="rlword1">rato</strong></p>
<button class="main" onclick="speak('rato')">🔊</button>
<div class="option" onclick="check(this,true)">rato</div>
<div class="option" onclick="check(this,false)">lato</div>

<hr>

<p><strong id="rlword2">rua</strong></p>
<button class="main" onclick="speak('rua')">🔊</button>
<div class="option" onclick="check(this,true)">rua</div>
<div class="option" onclick="check(this,false)">lua</div>

</div>

<!-- NASAL -->
<div class="card">
<h2 id="nasalTitle">🌬 鼻音练习</h2>
<p id="nasalInstructions">选择带鼻音的单词：</p>

<p><strong id="nasalword1">mão</strong></p>
<button class="main" onclick="speak('mão')">🔊</button>
<div class="option" onclick="check(this,true)">mão</div>
<div class="option" onclick="check(this,false)">mao</div>

<hr>

<p><strong id="nasalword2">pão</strong></p>
<button class="main" onclick="speak('pão')">🔊</button>
<div class="option" onclick="check(this,true)">pão</div>
<div class="option" onclick="check(this,false)">pao</div>

</div>

<!-- ESCRITA -->
<div class="card">
<h2 id="writeTitle">✍️ 拼写练习</h2>
<p id="writeText">听音并输入：</p>

<button class="main" onclick="speak(currentWord)">🔊 <span id="speakBtnText">播放</span></button>

<input id="inputWord" placeholder="输入单词">
<button class="main" onclick="checkInput()"><span id="submitBtnText">提交</span></button>

<p id="result" class="result"></p>
<div id="stats" class="stats"></div>
</div>

</div>

<script>

// 🌍 Tradução
let currentLang = 'zh';

function setLang(lang){
    currentLang = lang;
    
    if(lang==="en"){
        document.getElementById("title").innerText="Portuguese Practice";
        document.getElementById("alphabetTitle").innerText="🔤 Alphabet Practice";
        document.getElementById("alphabetText").innerText="Click and repeat:";
        document.getElementById("gameTitle").innerText="🎮 Alphabet Game";
        document.getElementById("gameText").innerText="Listen and choose the correct letter:";
        document.getElementById("playBtnText").innerText="Play";
        document.getElementById("listenTitle").innerText="👂 Listening Practice";
        document.getElementById("listenInstructions").innerText="Choose the word you hear:";
        document.getElementById("rlTitle").innerText="🔊 R vs L";
        document.getElementById("rlInstructions").innerText="Distinguish between R and L sounds:";
        document.getElementById("nasalTitle").innerText="🌬 Nasal Sounds";
        document.getElementById("nasalInstructions").innerText="Choose the word with nasal sound:";
        document.getElementById("writeTitle").innerText="✍️ Spelling Practice";
        document.getElementById("writeText").innerText="Listen and type the word:";
        document.getElementById("speakBtnText").innerText="Play";
        document.getElementById("submitBtnText").innerText="Submit";
        document.getElementById("inputWord").placeholder="Type the word";
    }else{
        document.getElementById("title").innerText="葡萄牙语练习";
        document.getElementById("alphabetTitle").innerText="🔤 字母练习";
        document.getElementById("alphabetText").innerText="点击并跟读：";
        document.getElementById("gameTitle").innerText="🎮 字母测试";
        document.getElementById("gameText").innerText="听声音并选择正确的字母：";
        document.getElementById("playBtnText").innerText="播放";
        document.getElementById("listenTitle").innerText="👂 听力练习";
        document.getElementById("listenInstructions").innerText="选择你听到的单词：";
        document.getElementById("rlTitle").innerText="🔊 R 和 L 区别";
        document.getElementById("rlInstructions").innerText="区分 R 和 L 的声音：";
        document.getElementById("nasalTitle").innerText="🌬 鼻音练习";
        document.getElementById("nasalInstructions").innerText="选择带鼻音的单词：";
        document.getElementById("writeTitle").innerText="✍️ 拼写练习";
        document.getElementById("writeText").innerText="听音并输入：";
        document.getElementById("speakBtnText").innerText="播放";
        document.getElementById("submitBtnText").innerText="提交";
        document.getElementById("inputWord").placeholder="输入单词";
    }
}

// 🔊 Áudio com API confiável
const clickCount = {};

function speak(text){
    if(!clickCount[text]) clickCount[text]=0;
    clickCount[text]++;
    
    let speed = clickCount[text]%2===0 ? 0.7 : 1;
    
    // Usar múltiplas APIs com fallback
    playAudioWithFallback(text, speed);
}

function playAudioWithFallback(text, speed){
    // Primeira tentativa: Google Translate TTS
    let url1 = "https://translate.google.com/translate_tts?ie=UTF-8&tl=pt&client=tw-ob&q=" + encodeURIComponent(text);
    
    let audio = new Audio(url1);
    audio.playbackRate = speed;
    
    audio.play().catch(err => {
        console.log("Tentando API alternativa 1...");
        // Segunda tentativa: eSpeak Online
        let url2 = "https://tts.readloud.net/api/tts?text=" + encodeURIComponent(text) + "&lang=pt-pt&speed=1";
        let audio2 = new Audio(url2);
        audio2.playbackRate = speed;
        
        audio2.play().catch(err2 => {
            console.log("Tentando API alternativa 2...");
            // Terceira tentativa: TTS Quest
            let url3 = "https://api.tts.quest/tts?text=" + encodeURIComponent(text) + "&lang=pt";
            let audio3 = new Audio(url3);
            audio3.playbackRate = speed;
            
            audio3.play().catch(err3 => {
                console.log("Nenhuma API de áudio funcionou. Verifique sua conexão.");
            });
        });
    });
}

// 🔤 Alfabeto
const alphabet = [
    ["A","a"],["B","bê"],["C","cê"],["D","dê"],["E","e"],
    ["F","efe"],["G","gê"],["H","agá"],["I","i"],["J","jota"],
    ["K","ká"],["L","éle"],["M","ême"],["N","ene"],["O","ó"],
    ["P","pê"],["Q","quê"],["R","érre"],["S","S"],["T","tê"],
    ["U","u"],["V","vê"],["W","dáblio"],["X","xis"],["Y","ípsilon"],
    ["Z","zê"]
];

alphabet.forEach(([l,s])=>{
    let b=document.createElement("button");
    b.className="main";
    b.innerText=l+" 🔊";
    b.onclick=()=>speak(s);
    document.getElementById("alphabet").appendChild(b);
});

// 🎮 Jogo do alfabeto
let currentCorrectLetter = "";

function playAlphabet(){
    let r=alphabet[Math.floor(Math.random()*alphabet.length)];
    currentCorrectLetter = r[0];
    speak(r[1]);
    generateOptions(r[0]);
}

function generateOptions(correct){
    document.getElementById("alphabetGame").innerHTML="";
    let opts=[correct];
    
    while(opts.length<4){
        let r=alphabet[Math.floor(Math.random()*alphabet.length)][0];
        if(!opts.includes(r)) opts.push(r);
    }
    
    opts.sort(()=>Math.random()-0.5);
    
    opts.forEach(l=>{
        let d=document.createElement("div");
        d.className="option";
        d.innerText=l;
        
        d.onclick=()=>{
            if(d.classList.contains("done")) return;
            d.classList.add("done");
            
            if(l===correct){
                d.classList.add("correct");
                document.getElementById("alphabetResult").innerText="✔ " + (currentLang==="en" ? "Correct!" : "正确！");
            }else{
                d.classList.add("wrong");
                document.getElementById("alphabetResult").innerText="❌ " + (currentLang==="en" ? "Wrong! It was: "+correct : "错误！正确答案是："+correct);
            }
        };
        
        document.getElementById("alphabetGame").appendChild(d);
    });
}

// ✔ Escolha para exercícios de escuta
function check(el,correct){
    if(el.classList.contains("done")) return;
    el.classList.add("done");
    el.classList.add(correct?"correct":"wrong");
}

// ✍️ Escrita
const words=["casa","bolo","mesa","mala","rato","rua","lua","mão","pão","amigo","livro","gato"];
let currentWord=words[Math.floor(Math.random()*words.length)];
let correctCount = 0;
let totalCount = 0;

function checkInput(){
    let val=document.getElementById("inputWord").value.trim().toLowerCase();
    
    totalCount++;
    
    if(val===currentWord){
        correctCount++;
        document.getElementById("result").innerText="✔ " + (currentLang==="en" ? "Correct! Next..." : "正确！下一个...");
        currentWord=words[Math.floor(Math.random()*words.length)];
        document.getElementById("inputWord").value="";
    }else{
        document.getElementById("result").innerText="❌ " + (currentLang==="en" ? "Wrong! It was: "+currentWord : "错误！正确答案是："+currentWord);
    }
    
    updateStats();
}

function updateStats(){
    let percentage = totalCount > 0 ? Math.round((correctCount/totalCount)*100) : 0;
    let statsText = currentLang==="en" 
        ? `Correct: ${correctCount}/${totalCount} (${percentage}%)`
        : `正确: ${correctCount}/${totalCount} (${percentage}%)`;
    document.getElementById("stats").innerText = statsText;
}

document.getElementById("inputWord").addEventListener("keypress",e=>{
    if(e.key==="Enter") checkInput();
});

// Inicializar idioma
setLang('zh');

</script>

</body>
</html>
